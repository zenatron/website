<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="sso-title sso-desc">
  <title id="sso-title">SSO authentication flow</title>
  <desc id="sso-desc">A diagram showing the single sign-on flow: user authenticates through a reverse proxy which checks with an identity provider before granting access to backend services.</desc>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--c-hue-green, #9bd68a)" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--c-hue-blue, #7fbde8)" />
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--c-muted, #a69e8d)" />
    </marker>
  </defs>

  <rect width="1200" height="640" fill="var(--c-sunken, #100f0c)" />

  <!-- Title -->
  <text x="40" y="50" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="28" font-weight="700" fill="var(--c-text, #ede7da)">Single sign-on flow</text>
  <text x="40" y="78" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="15" fill="var(--c-muted, #a69e8d)">One login authenticates you across all self-hosted services</text>


  <!-- User -->
  <rect x="80" y="150" width="200" height="70" rx="12" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-violet, #bca4ff)" stroke-width="2.5"/>
  <text x="180" y="182" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="18" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">You</text>
  <text x="180" y="204" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Browser</text>

  <!-- Reverse proxy -->
  <rect x="370" y="150" width="210" height="70" rx="12" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2.5"/>
  <text x="475" y="180" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="16" font-weight="700" fill="var(--c-hue-green, #9bd68a)" text-anchor="middle">Reverse Proxy</text>
  <text x="475" y="202" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Caddy + forward_auth</text>

  <!-- arrow 1: user → proxy -->
  <line x1="280" y1="185" x2="370" y2="185" stroke="var(--c-muted, #a69e8d)" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <text x="325" y="170" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="middle">GET /app</text>


  <!-- IdP -->
  <rect x="370" y="280" width="210" height="70" rx="12" fill="var(--c-raised, #26231d)" stroke="var(--c-text, #ede7da)" stroke-width="2.5"/>
  <text x="475" y="310" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="16" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">Identity Provider</text>
  <text x="475" y="332" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Pocket ID</text>

  <!-- arrow 2: proxy → IdP -->
  <line x1="475" y1="220" x2="475" y2="280" stroke="var(--c-hue-blue, #7fbde8)" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="500" y="252" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-hue-blue, #7fbde8)">Check auth</text>


  <!-- Login page -->
  <rect x="80" y="425" width="200" height="70" rx="12" fill="var(--c-raised, #26231d)" stroke="var(--c-text, #ede7da)" stroke-width="2.5"/>
  <text x="180" y="455" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="16" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">Login page</text>
  <text x="180" y="477" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" fill="var(--c-muted, #a69e8d)" text-anchor="middle">IdP-hosted</text>

  <!-- arrow 3: IdP redirects to its login page -->
  <line x1="370" y1="322" x2="284" y2="440" stroke="var(--c-muted, #a69e8d)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="318" y="370" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="end">Redirect to login</text>


  <!-- Backend services -->
  <rect x="370" y="450" width="150" height="55" rx="10" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-violet, #bca4ff)" stroke-width="2"/>
  <text x="445" y="474" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="14" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">Jellyfin</text>
  <text x="445" y="494" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Media</text>

  <rect x="545" y="450" width="150" height="55" rx="10" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-violet, #bca4ff)" stroke-width="2"/>
  <text x="620" y="474" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="14" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">Grafana</text>
  <text x="620" y="494" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Dashboards</text>

  <rect x="720" y="450" width="150" height="55" rx="10" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-violet, #bca4ff)" stroke-width="2"/>
  <text x="795" y="474" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="14" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">Nextcloud</text>
  <text x="795" y="494" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Files</text>

  <rect x="895" y="450" width="150" height="55" rx="10" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-violet, #bca4ff)" stroke-width="2"/>
  <text x="970" y="474" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="14" font-weight="600" fill="var(--c-text, #ede7da)" text-anchor="middle">n8n</text>
  <text x="970" y="494" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="11" fill="var(--c-muted, #a69e8d)" text-anchor="middle">Automation</text>

  <!-- arrows to backends once authenticated -->
  <line x1="445" y1="350" x2="445" y2="450" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="475" y1="350" x2="620" y2="450" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="505" y1="350" x2="795" y2="450" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="535" y1="350" x2="970" y2="450" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- The steps, numbered as on the arrows -->
  <circle cx="680" cy="160" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="680" y="164" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">1</text>
  <text x="700" y="165" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="15" font-weight="600" fill="var(--c-text, #ede7da)">User visits a protected app</text>
  <circle cx="680" cy="196" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="680" y="200" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">2</text>
  <text x="700" y="201" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="15" font-weight="600" fill="var(--c-text, #ede7da)">Proxy checks authentication</text>
  <circle cx="680" cy="232" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="680" y="236" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">3</text>
  <text x="700" y="237" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="15" font-weight="600" fill="var(--c-text, #ede7da)">Not authenticated? Redirect to login</text>
  <circle cx="680" cy="268" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="680" y="272" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">4</text>
  <text x="700" y="273" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="15" font-weight="600" fill="var(--c-text, #ede7da)">Authenticate once, access everything</text>
  <circle cx="325" cy="204" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="325" y="208" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">1</text>
  <circle cx="452" cy="250" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="452" y="254" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">2</text>
  <circle cx="338" cy="398" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="338" y="402" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">3</text>
  <circle cx="600" cy="400" r="10" fill="var(--c-raised, #26231d)" stroke="var(--c-muted, #a69e8d)" stroke-width="1.5"/>
  <text x="600" y="404" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="12" font-weight="700" fill="var(--c-text, #ede7da)" text-anchor="middle">4</text>
  <!-- Success indicator -->
  <rect x="370" y="540" width="750" height="70" rx="10" fill="var(--c-raised, #26231d)" stroke="var(--c-hue-green, #9bd68a)" stroke-width="1.5"/>
  <text x="745" y="570" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="16" font-weight="700" fill="var(--c-hue-green, #9bd68a)" text-anchor="middle">One identity. One login. Every app.</text>
  <text x="745" y="595" font-family="var(--font-sans, system-ui, -apple-system, sans-serif)" font-size="13" fill="var(--c-muted, #a69e8d)" text-anchor="middle">No per-app passwords. MFA enforced once. Revoke access in one place.</text>
</svg>
