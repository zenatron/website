<line x1="260.0" y1="660" x2="730.0" y2="660" stroke="var(--c-text, #35312a)" stroke-width="3" marker-start="url(#ah_1e1e1e)" marker-end="url(#ah_1e1e1e)"/>
<text x="40" y="44.0" font-size="24" fill="var(--c-text, #35312a)" text-anchor="start">WireGuard  Noise_IKpsk2  Handshake  (1-RTT)</text>
<text x="260.0" y="106.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Initiator  (Device A)</text>
<text x="730.0" y="106.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Responder  (Device B)</text>
<text x="130" y="185.0" font-size="15" fill="var(--c-hue-blue, #7fbde8)" text-anchor="start">generates ephemeral</text>
<text x="130" y="203.75" font-size="15" fill="var(--c-hue-blue, #7fbde8)" text-anchor="start">keypair e_i</text>
<text x="270.0" y="250.0" font-size="15" fill="var(--c-text, #35312a)" text-anchor="start">1.  Initiation msg:  e_i(pub),  enc{ s_i(pub) },  enc{ timestamp }</text>
<text x="730.0" y="331.25" font-size="15" fill="var(--c-text, #35312a)" text-anchor="middle">DH1 = e_i x s_r</text>
<text x="730.0" y="350.0" font-size="15" fill="var(--c-text, #35312a)" text-anchor="middle">DH2 = s_i x s_r</text>
<text x="810" y="415.0" font-size="15" fill="var(--c-hue-green, #9bd68a)" text-anchor="end">generates ephemeral</text>
<text x="810" y="433.75" font-size="15" fill="var(--c-hue-green, #9bd68a)" text-anchor="end">keypair e_r</text>
<text x="280.0" y="470.0" font-size="15" fill="var(--c-text, #35312a)" text-anchor="start">2.  Response msg:  e_r(pub),  enc{ empty }</text>
<text x="510.0" y="551.25" font-size="15" fill="var(--c-text, #35312a)" text-anchor="middle">DH3 = e_i x e_r   -&gt;   mix all DH via HKDF   -&gt;   mix pre-shared key (psk2)</text>
<text x="510.0" y="570.0" font-size="15" fill="var(--c-text, #35312a)" text-anchor="middle">=&gt;  symmetric session keys  (ChaCha20-Poly1305)</text>
<text x="290.0" y="635.0" font-size="15" fill="var(--c-text, #35312a)" text-anchor="start">3.  Encrypted transport data  (forward-secret, E2E)</text>
</svg>