<rect x="560" y="300" width="340" height="70" rx="10" fill="var(--c-tint-green, #1e2e18)" fill-opacity="1.0" stroke="var(--c-hue-green, #9bd68a)" stroke-width="2"/>
<rect x="110" y="520" width="800" height="70" rx="10" fill="var(--c-tint-orange, #3a2418)" fill-opacity="1.0" stroke="var(--c-hue-orange, #ffa06b)" stroke-width="2"/>
