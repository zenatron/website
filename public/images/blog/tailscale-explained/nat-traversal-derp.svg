<text x="40" y="42.0" font-size="22" fill="var(--c-text, #35312a)" text-anchor="start">NAT Traversal:  STUN Hole-Punching  with  DERP Fallback</text>
<text x="58" y="328.0" font-size="16" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">NAT  A</text>
<text x="728" y="328.0" font-size="16" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">NAT  B</text>
<text x="165.0" y="441.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Device A</text>
<text x="835.0" y="441.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Device B</text>
<text x="510.0" y="106.375" font-size="17" fill="var(--c-text, #35312a)" text-anchor="middle">STUN server</text>
<text x="510.0" y="211.0" font-size="16" fill="var(--c-text, #35312a)" text-anchor="middle">Coordination</text>
<text x="510.0" y="231.0" font-size="16" fill="var(--c-text, #35312a)" text-anchor="middle">server (control)</text>
<text x="510.0" y="601.375" font-size="17" fill="var(--c-text, #35312a)" text-anchor="middle">DERP relay</text>
<text x="250" y="224.0" font-size="14" fill="var(--c-text, #35312a)" text-anchor="start">1.  STUN: learn my</text>
<text x="250" y="241.5" font-size="14" fill="var(--c-text, #35312a)" text-anchor="start">public ip:port</text>
<text x="810" y="224.0" font-size="14" fill="var(--c-text, #35312a)" text-anchor="end">1.  STUN: learn my</text>
<text x="810" y="241.5" font-size="14" fill="var(--c-text, #35312a)" text-anchor="end">public ip:port</text>
<text x="360" y="309.0" font-size="14" fill="var(--c-hue-green, #9bd68a)" text-anchor="start">2.  register + exchange peer public addrs (metadata)</text>
<text x="360" y="415.0" font-size="15" fill="var(--c-hue-green, #9bd68a)" text-anchor="start">3.  simultaneous send = hole punch  -&gt;  DIRECT P2P</text>
<text x="300" y="654.0" font-size="14" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">4.  fallback when hole-punch fails (symmetric NAT / UDP blocked):</text>
<text x="300" y="676.0" font-size="14" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">     encrypted WireGuard blobs relayed  -  DERP can&#x27;t read them</text>
</svg>