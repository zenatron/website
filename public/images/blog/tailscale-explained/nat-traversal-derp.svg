<text x="40" y="42.0" font-size="22" fill="var(--c-text, #35312a)" text-anchor="start">NAT Traversal: STUN Hole-Punching with DERP Fallback</text>
<text x="58" y="328.0" font-size="16" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">NAT A</text>
<text x="728" y="328.0" font-size="16" fill="var(--c-hue-orange, #ffa06b)" text-anchor="start">NAT B</text>
<text x="165.0" y="441.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Device A</text>
<text x="835.0" y="441.75" font-size="18" fill="var(--c-text, #35312a)" text-anchor="middle">Device B</text>
<text x="510.0" y="106.375" font-size="17" fill="var(--c-text, #35312a)" text-anchor="middle">STUN server</text>
<text x="510.0" y="211.0" font-size="16" fill="var(--c-text, #35312a)" text-anchor="middle">Coordination</text>
<text x="510.0" y="231.0" font-size="16" fill="var(--c-text, #35312a)" text-anchor="middle">server (control)</text>
<text x="510.0" y="601.375" font-size="17" fill="var(--c-text, #35312a)" text-anchor="middle">DERP relay</text>
<text x="152" y="224.0" font-size="14" fill="var(--c-text, #35312a)" text-anchor="start">1. STUN: learn my</text>
<text x="152" y="241.5" font-size="14" fill="var(--c-text, #35312a)" text-anchor="start">public ip:port</text>
<text x="848" y="224.0" font-size="14" fill="var(--c-text, #35312a)" text-anchor="end">1. STUN: learn my</text>
<text x="848" y="241.5" font-size="14" fill="var(--c-text, #35312a)" text-anchor="end">public ip:port</text>
<text x="510" y="290" font-size="14" fill="var(--c-hue-green, #9bd68a)" text-anchor="middle">2. register + exchange peer</text>
<text x="510" y="308" font-size="14" fill="var(--c-hue-green, #9bd68a)" text-anchor="middle">public addresses (metadata)</text>
<text x="360" y="415.0" font-size="15" fill="var(--c-hue-green, #9bd68a)" text-anchor="start">3. simultaneous send = hole punch → direct P2P</text>
<text x="510" y="660" font-size="14" fill="var(--c-hue-orange, #ffa06b)" text-anchor="middle">4. fallback when hole-punch fails (symmetric NAT / UDP blocked):</text>
<text x="510" y="682" font-size="14" fill="var(--c-hue-orange, #ffa06b)" text-anchor="middle">encrypted WireGuard blobs relayed — DERP can’t read them</text>
