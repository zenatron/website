    </linearGradient>
    <radialGradient id="screen" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#7FD1B9" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#7FD1B9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
