<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #E9E6DF; padding: 32px; width: 1400px; font-family: -apple-system, sans-serif; display: grid; grid-template-columns: 896px 360px; gap: 32px; }
  .gh { border-radius: 8px; padding: 24px; border: 1px solid; }
  .dark { background: #0d1117; border-color: #30363d; color: #e6edf3; }
  .light { background: #fff; border-color: #d0d7de; color: #1f2328; }
  h2 { font-size: 24px; padding-bottom: 8px; margin-bottom: 16px; border-bottom: 1px solid #30363d; }
  .light h2 { border-color: #d0d7de; }
  p { line-height: 0; }
  p + p { margin-top: 12px; }
  img { max-width: 100%; vertical-align: middle; }
</style>
</head>
<body>
<script>
  const sec = (t) => `
  <div class="gh ${t}">
    <h2>📫 Get in Touch</h2>
    <p><img width="404" src="contact/email-${t}.png"> <img width="404" src="contact/call-${t}.png"></p>
    <p>${['site','linkedin','bluesky','discord','underscore','kofi'].map(i => `<img width="88" src="contact/${i}.png">`).join(' ')}</p>
  </div>`;
  document.body.innerHTML = sec('dark') + sec('dark') + sec('light') + sec('light');
</script>
</body>
</html>
